<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Modellr is a free, open-source, local-first database schema designer. Design tables and relationships visually in your browser, import SQL or Prisma, and export SQL, Prisma, Drizzle, DBML and more. No sign-up." />
    <title>Modellr — free, open-source, local-first database schema designer</title>

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Modellr" />
    <meta property="og:title" content="Modellr — free, open-source, local-first database schema designer" />
    <meta property="og:description" content="Design database schemas visually in your browser. Free and open source (MIT). No sign-up; your schemas stay in your browser." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Modellr — free, open-source, local-first database schema designer" />
    <meta name="twitter:description" content="Design database schemas visually in your browser. Free and open source (MIT). No sign-up; your schemas stay in your browser." />

    <!-- Prevent flash of light mode -->
    <script>
      const t = localStorage.getItem('sf-theme') ?? 'dark';
      document.documentElement.setAttribute('data-theme', t);
    </script>

    <!-- Google Fonts: Geist + Geist Mono + Syne + Instrument Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Syne:wght@700;800&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Prevent layout shift before JS loads */
      html, body { margin: 0; padding: 0; background: #131312; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
